<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkpoint 1</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.12.1/css/all.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="gridOne">
      <p>Hello World</p>
      <p>My Fantastic Content</p>
    </div>
    <div class="gridTwo">
      <div class="gt-first-paragraph">Hello people!</div>
      <div class="gt-second-paragraph">How are you?</div>
      <div class="gt-third-paragraph">My name is Cristian Plaza</div>
    </div>
    <div class="gridThree">
      <div class="gth-paragraph">
        <p>City of Donostia - San Sebastián</p>
      </div>
      <div class="gth-image">
        <img src="images/Donostia-1.jpg" alt="Panoramic of Donostia" />
      </div>
    </div>
    <div class="gridFour">
      <div class="gf-paragraph">
        <p>First row, single paragraph!</p>
      </div>
      <div id="two-paragraphs">
        <p>Second row, first column!</p>
        <p>Second row, second column!</p>
      </div>
    </div>
    <div class="gridFive">
      <div class="gfv-paragraph">
        <p>This is my paragraph</p>
      </div>
      <div id="grid-images">
        <img
          src="images/paisaje-profundidad-lineas-734x489.jpg"
          alt="Random picture"
        />
        <img src="images/profile-picture.jpeg" alt="Profile picture" />
      </div>
    </div>
    <div class="gridSix">
      <p id="icon">&#xf753;</p>
      <p id="my-paragraph">My Lato Google Font is applied here!</p>
    </div>
  </body>
</html>
